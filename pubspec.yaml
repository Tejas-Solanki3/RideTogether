name: ride_together
description: A premium campus carpool matching app, built with Flutter, Riverpod and Firestore.
publish_to: 'none'
version: 2.1.0+4

environment:
  sdk: '>=3.10.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^2.0.0
  flutter_riverpod: ^2.6.1
  firebase_core: ^4.0.0
  firebase_auth: ^6.0.0
  cloud_firestore: ^6.0.0
  shared_preferences: ^2.5.3
  flutter_svg: ^2.2.0
  intl: ^0.20.2
  uuid: ^4.5.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/illustrations/
    - assets/avatars/
    - assets/svg/
    - assets/icons/
  fonts:
    - family: Manrope
      fonts:
        - asset: assets/fonts/Manrope.ttf
