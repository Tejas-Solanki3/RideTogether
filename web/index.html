<!DOCTYPE html>
<html lang="en">
<head>
  <base href="$FLUTTER_BASE_HREF">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#18221c">
  <meta name="description" content="Your campus, connected. Find a shared ride, offer a seat, and go together with RideTogether.">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="RideTogether">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">
  <link rel="icon" type="image/png" href="favicon.png">
  <link rel="manifest" href="manifest.json">
  <title>RideTogether — Your campus, connected.</title>
  <style>
    html, body {margin:0;background:#f7f8f5;font-family:Arial,sans-serif;color:#18221c}
    #loading{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;gap:14px;font-weight:700;font-size:22px;letter-spacing:-.6px;transition:opacity .25s}
    #loading svg{width:44px;height:44px}
    #loading:after{content:'';width:16px;height:16px;border:2px solid #e1e6dd;border-top-color:#2c6b4b;border-radius:50%;animation:spin .8s linear infinite;margin-left:10px}
    @keyframes spin{to{transform:rotate(360deg)}}
  </style>
</head>
<body>
  <div id="loading"><svg viewBox="0 0 48 48" xmlns="http://www.w3.org/2000/svg"><rect width="48" height="48" rx="14" fill="#18221c"/><path d="M12 29V22c0-5 3-8 8-8h5m-4-4 5 4-5 4M36 19v7c0 5-3 8-8 8h-5m4-4-5 4 5 4" fill="none" stroke="white" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg>RideTogether</div>
  <script>window.addEventListener('flutter-first-frame',()=>{const el=document.getElementById('loading');if(el)el.remove()});</script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
